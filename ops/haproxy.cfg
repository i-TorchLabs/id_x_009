global
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 5s
    timeout client  1800s
    timeout server  50s
    timeout http-request 10s

frontend http_in
    bind *:8080
    acl is_api path_beg /b/id_x_009/
    use_backend service_backend if is_api
    default_backend web_backend

backend web_backend
    option httpchk GET /
    http-check expect rstatus ^(200|307|308)$
    server web 127.0.0.1:2000 check inter 10s fall 3 rise 2

backend service_backend
    option httpchk GET /b/id_x_009/graphql
    http-check expect rstatus ^(200|400|405)$
    timeout server 1800s
    server service 127.0.0.1:7000 check inter 10s fall 3 rise 2
