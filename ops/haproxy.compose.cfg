# ============================================================================
# HAProxy 配置（podman-compose 专用）—— id_x_009 流量入口
#
# compose 部署走标准 bridge 网络 + DNS 服务名互访：
#   - web     监听 web:2000
#   - service 监听 service:7000
#   - haproxy 监听 :8080 → 宿主机 ${POD_PORT:-8009}
#
# up.sh 的 Pod 模式请使用 haproxy.cfg（127.0.0.1 互访），两者勿混用。
# ============================================================================

global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-keep-alive
    http-reuse safe
    retries 3
    option  redispatch
    timeout connect 5s
    timeout client  600s
    timeout server  600s
    timeout http-request 10s
    timeout http-keep-alive 10s
    compression algo gzip
    compression type text/plain text/css text/html application/json application/javascript application/x-javascript text/xml application/xml image/svg+xml

frontend http_in
    bind *:8080
    acl is_api path_beg /b/id_x_009/
    use_backend service_backend if is_api
    default_backend web_backend

backend web_backend
    option httpchk GET /
    http-check expect rstatus ^(200|307|308)$
    server web web:2000 check inter 10s fall 3 rise 2

backend service_backend
    option httpchk GET /b/id_x_009/graphql
    http-check expect rstatus ^(200|400|405)$
    timeout server 600s
    server service service:7000 check inter 10s fall 3 rise 2
